<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>혼자 합주실 — 새 주소</title>
<meta http-equiv="refresh" content="4;url=https://htcho-max.github.io/hapju/">
<style>
:root{--bg:#eceff3;--ink:#19202c;--mut:#5c6576;--acc:#a8650f;--accInk:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#101318;--ink:#e6eaf1;--mut:#8d96a7;--acc:#e0a040;--accInk:#16120a}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:24px;box-sizing:border-box}
main{max-width:30rem}h1{font-size:22px;margin:0 0 8px}p{color:var(--mut);margin:8px 0}
a.b{display:inline-block;margin-top:14px;padding:12px 20px;border-radius:12px;background:var(--acc);color:var(--accInk);text-decoration:none;font-weight:600}
</style></head><body><main>
<h1>혼자 합주실이 새 주소로 옮겼습니다</h1>
<p>잠시 후 새 주소로 넘어갑니다. 홈 화면에 앱으로 설치해 두셨다면 새 주소에서 다시 설치해 주세요.</p>
<p>녹음은 주소마다 따로 저장되어, 이 주소에서 만든 프로젝트는 새 주소에 보이지 않습니다.</p>
<a class="b" href="https://htcho-max.github.io/hapju/">새 주소로 가기</a>
</main>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(new URL(r.scope).pathname.startsWith('/hapju/'))r.unregister()})).catch(()=>{});</script>
</body></html>
